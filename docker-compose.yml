services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: govjobs, POSTGRES_PASSWORD: govjobs, POSTGRES_DB: govjobs}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U govjobs"], interval: 5s, retries: 20}
    restart: unless-stopped
  api:
    build: ./backend
    env_file: ./backend/.env
    environment: {DATABASE_URL: "postgresql+psycopg://govjobs:govjobs@db:5432/govjobs"}
    command: sh -c "python -m app.migrate && python -m app.seed_registry && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: ["./secrets:/secrets:ro"]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment: {DATABASE_URL: "postgresql+psycopg://govjobs:govjobs@db:5432/govjobs"}
    command: sh -c "sleep 25 && python -m app.scheduler"
    volumes: ["./secrets:/secrets:ro"]
    depends_on: 
      db: 
        condition: service_healthy
      api: 
        condition: service_started
    restart: unless-stopped
volumes: {pgdata: {}}